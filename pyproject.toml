[project]
name = "muxstudio"
version = "1.3.2"
description = "Thay SubFetch, SubPrep, MuxTool: tải phụ đề, đồng bộ, mux MKV chuẩn Jellyfin"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "keyring",
    "send2trash",
    "customtkinter>=5.2.2,<7",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "golden: đối chiếu với hàm PowerShell gốc trong reference/*.bat (cần pwsh)",
]
